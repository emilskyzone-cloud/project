services:
  - type: web
    name: aimaker-api-free
    runtime: node
    plan: free
    region: singapore
    branch: render-free-deploy
    rootDir: server
    buildCommand: npm ci --include=dev
    startCommand: npm run start:render
    healthCheckPath: /
    autoDeployTrigger: checksPass
    domains:
      - api.aimaker.tech
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://aimaker.tech,https://www.aimaker.tech,https://aimaker-web-free.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLOUD_API_KEY
        sync: false

  - type: web
    name: aimaker-web-free
    runtime: static
    branch: render-free-deploy
    buildCommand: cd client && npm ci --include=dev && npm run build
    staticPublishPath: client/dist
    autoDeployTrigger: checksPass
    domains:
      - aimaker.tech
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASEURL
        value: https://api.aimaker.tech
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
