name: Validate AI Maker

on:
  push:
    branches:
      - render-free-deploy
    paths:
      - "client/**"
      - "server/**"
      - "render.yaml"
      - ".github/workflows/validate-ai-maker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build frontend
        working-directory: client
        run: |
          npm ci --include=dev
          npm run build

      - name: Install and build backend
        working-directory: server
        run: |
          npm ci --include=dev
          npm run build
