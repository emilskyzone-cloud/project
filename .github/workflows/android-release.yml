name: Build Aimaker Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build release bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: aimaker-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
